# CI for HyperSABMemory. Node 20 remains the compatibility floor; Node 22/24
# are maintained LTS lines. All supported operating systems run these lanes.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same branch push / PR to keep queue times low.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      # Run every combination even if one fails, so a single flaky OS/node
      # combo does not hide results from the rest of the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm # requires package-lock.json (present at repo root)
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit # tsconfig.json exists at root; catches type errors before tests
      - run: npm test
      - run: npm run eval:baseline
      - run: npm run package:smoke

# Ordinary development checks run here on PRs and branch pushes so contributors get
# actionable pass/fail feedback. Mandatory fail-closed release readiness runs in
# `.github/workflows/release.yml` (on `v*` tags and `workflow_dispatch`) and blocks
# publication via both CI gates and `package.json` `prepublishOnly`.
#
# The recall/leak benchmark (tests/memorybench.test.ts, thresholds recall >= 0.80,
# zero forgotten-fact leaks) runs inside the blocking matrix job via `npm test`,
# so no separate advisory eval job is needed.

