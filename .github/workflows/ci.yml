# CI for HyperSABMemory
# Matrix covers the declared engines range (node >=20) on both Linux and Windows:
# the project is developed on Windows and has shipped a Windows-only chokidar bug,
# so windows-latest is tested explicitly instead of assumed.
# Node 20 is the floor because vitest 4 (dev toolchain) requires ^20 || ^22 || >=24.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same branch push / PR to keep queue times low.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      # Run every combination even if one fails, so a single flaky OS/node
      # combo does not hide results from the rest of the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm # requires package-lock.json (present at repo root)
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit # tsconfig.json exists at root; catches type errors before tests
      - run: npm test
      - run: npm run build

  eval:
    # Advisory recall benchmark (MemoryBench). Kept as a separate job pinned to a
    # single runner (ubuntu + node 22) so the matrix stays fast and eval
    # flakiness cannot block cross-platform test results.
    name: eval (advisory)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval
