# CI for HyperSABMemory. Node 20 remains the compatibility floor; Node 22/24
# are maintained LTS lines. All supported operating systems run these lanes.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same branch push / PR to keep queue times low.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      # Run every combination even if one fails, so a single flaky OS/node
      # combo does not hide results from the rest of the matrix.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm # requires package-lock.json (present at repo root)
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit # tsconfig.json exists at root; catches type errors before tests
      - run: npm test
      - run: npm run eval:baseline
      - run: npm run package:smoke

  # Separate job keeps ordinary development test results visually distinct from
  # release eligibility without treating a failing release gate as optional.
  release-readiness:
    name: release-readiness (${{ matrix.os }}, node 24)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Enforce frozen release preflight
        run: npm run release:preflight

# The recall/leak benchmark (tests/memorybench.test.ts, thresholds recall >= 0.80,
# zero forgotten-fact leaks) runs inside the blocking matrix job via `npm test`,
# so no separate advisory eval job is needed.

