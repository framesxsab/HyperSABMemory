name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: release-gates (${{ matrix.os }}, node 24)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release tag matches package version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: node -e "const p = require('./package.json'); if (process.env.GITHUB_REF_NAME !== 'v' + p.version) throw new Error('tag/package version mismatch')"
      - name: Typecheck
        run: npx tsc --noEmit
      - run: npm test
      - run: npm run eval
      - run: npm run eval:baseline
      - run: npm run package:smoke
      - name: Enforce fail-closed release preflight
        run: npm run release:preflight

  publish:
    needs: gates
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Publish preview package to npm
        if: contains(github.ref_name, '-preview.')
        run: npm publish --tag preview
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - name: Publish stable package to npm
        if: "!contains(github.ref_name, '-preview.')"
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
